version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rxsaas-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rxsaas
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d rxsaas"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rxsaas-network

volumes:
  postgres_data:
    driver: local

networks:
  rxsaas-network:
    driver: bridge
